name: Build Lumiere

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Internal ad-hoc DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          xcodebuild \
            -project Lumiere.xcodeproj \
            -scheme Lumiere \
            -destination 'platform=macOS' \
            -derivedDataPath build/TestDerivedData \
            test

      - name: Build and package internal ad-hoc DMG
        run: Scripts/package-internal-dmg.sh

      - name: Upload private internal DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumiere-Internal-AdHoc
          path: |
            build/Lumiere-Internal-AdHoc.dmg
            build/Lumiere-Internal-AdHoc.dmg.sha256
          if-no-files-found: error
